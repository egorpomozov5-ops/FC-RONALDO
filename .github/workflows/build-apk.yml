name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.2.2"
  EXPORT_PRESET: "Android"
  APK_NAME: "FC-RONALDO.apk"

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. Unpack fc_ronaldo_ready.zip (if it was uploaded to the repo as an archive)
      - name: Unpack project archive
        run: |
          ZIP_FILE=$(find . -maxdepth 3 -type f -name "fc_ronaldo_ready.zip" -not -path "./.git/*" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Found archive: $ZIP_FILE"
            mkdir -p "$GITHUB_WORKSPACE/_unpacked"
            unzip -q -o "$ZIP_FILE" -d "$GITHUB_WORKSPACE/_unpacked"
            echo "SEARCH_ROOT=$GITHUB_WORKSPACE/_unpacked" >> "$GITHUB_ENV"
            find "$GITHUB_WORKSPACE/_unpacked" -maxdepth 2 | head -n 40
          else
            echo "No archive found, using files from the repository as they are"
            echo "SEARCH_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          fi

      # 2. Locate the project and check required files
      - name: Locate project and check required files
        run: |
          PROJECT_FILE=$(find "$SEARCH_ROOT" -name project.godot -not -path "*/.godot/*" | head -n 1)
          if [ -z "$PROJECT_FILE" ]; then
            echo "::error::project.godot not found (searched in $SEARCH_ROOT)"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          if [ ! -f "$PROJECT_DIR/export_presets.cfg" ]; then
            echo "::error::export_presets.cfg not found next to project.godot ($PROJECT_DIR)"
            exit 1
          fi
          for ICON in icon_192.png icon_foreground.png icon_background.png; do
            if [ ! -f "$PROJECT_DIR/$ICON" ]; then
              echo "::error::$ICON not found in $PROJECT_DIR (it is referenced by export_presets.cfg)"
              exit 1
            fi
          done
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools build-tools;33.0.2 platforms;android-33 cmake;3.10.2.4988404 ndk;23.2.8568313"

      - name: Install Godot and export templates
        run: |
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          TPL_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          cd "$RUNNER_TEMP"
          wget -q "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O godot.zip
          wget -q "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -O templates.tpz
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          unzip -q templates.tpz
          mkdir -p "$TPL_DIR"
          mv templates/* "$TPL_DIR"/
          rm -rf godot.zip templates.tpz templates
          godot --version

      - name: Create debug keystore
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey \
            -keypass android -keystore "$HOME/debug.keystore" -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 \
            -deststoretype pkcs12

      - name: Configure Godot editor for Android export
        run: |
          # the first headless start creates the Godot config directory
          godot --headless --editor --quit || true
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "${HOME}/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          export/android/shutdown_adb_on_exit = true
          SETTINGS
          sed -i 's/^ *//' "$HOME/.config/godot/editor_settings-4.tres"
          cat "$HOME/.config/godot/editor_settings-4.tres"

      - name: Import project resources
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          # import twice: the first pass can miss resources created during import
          godot --headless --editor --quit || true
          godot --headless --editor --quit || true

      - name: Export debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mkdir -p build
          godot --headless --verbose --export-debug "$EXPORT_PRESET" "build/$APK_NAME"
          ls -la build

      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          test -s "build/$APK_NAME" || { echo "::error::APK was not produced"; exit 1; }
          BT="$ANDROID_HOME/build-tools/33.0.2"
          "$BT/aapt" dump badging "build/$APK_NAME" | grep -E "^package:|application-label:|native-code" || true
          "$BT/aapt" dump badging "build/$APK_NAME" | grep -q "name='com.fcronaldo.game'" \
            || { echo "::error::Wrong package name in APK"; exit 1; }
          "$BT/apksigner" verify --verbose "build/$APK_NAME" | head -n 5

      # 3. Runs only if all previous steps succeeded
      - name: Upload APK (Actions -> run -> Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: FC-RONALDO-apk
          path: ${{ env.PROJECT_DIR }}/build/${{ env.APK_NAME }}
          if-no-files-found: error
          retention-days: 30